name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    uses: minegene-labs/workflows/.github/workflows/release.yml@v1.1.0
    with:
      scheme: Reelmark
      xcodegen: false
      macos-runner: xcode-27
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      app-id: ${{ secrets.SYNC_APP_ID }}
      app-key: ${{ secrets.SYNC_APP_KEY }}
